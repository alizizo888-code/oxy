name: Trigger Oxygen WordPress cron

on:
  push:
    branches: [main]
    paths:
      - 'oxygen-ac-automation/**'
      - 'index.html'
      - 'articles/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/oxygen-wp-cron.yml'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxygen-wp-cron
  cancel-in-progress: false

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository for article and sitemap smoke checks
        uses: actions/checkout@v7.0.1

      - name: Check that the live homepage uses the new loader
        shell: bash
        run: |
          set -euo pipefail
          url="https://oxygen11.com/?deployment_check=$(date +%s)"
          body="$(mktemp)"
          status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
          if [[ "$status" =~ ^2[0-9][0-9]$ ]] && grep -Fq "oxygen-maintenance-home.html" "$body"; then
            echo "Live root loader includes the full-page asset fetch."
          else
            echo "::warning::Live homepage index is not using the new full-page loader yet (HTTP $status). The public-root FTP deployment is still required."
          fi
          rm -f "$body"

      - name: Check that the live homepage asset is deployed
        shell: bash
        run: |
          set -euo pipefail
          url='https://oxygen11.com/oxygen-ac-automation/assets/oxygen-maintenance-home.html'
          body="$(mktemp)"
          status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
          bytes="$(wc -c < "$body" | tr -d ' ')"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || [[ "$bytes" -lt 50000 ]] || ! grep -qi '<html' "$body"; then
            echo "::error::The live homepage asset is missing or incomplete: HTTP $status, $bytes bytes at $url"
            head -c 250 "$body" || true
            rm -f "$body"
            exit 1
          fi
          echo "Live homepage asset is reachable: HTTP $status, $bytes bytes."
          rm -f "$body"

      - name: Verify latest article pages and sitemap are publicly served
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/oxygen-article-urls.txt
          import json
          from pathlib import Path
          rows = json.loads(Path("articles/catalog.json").read_text(encoding="utf-8"))
          rows = sorted(rows, key=lambda x: (x.get("published_at", ""), x.get("slug", "")), reverse=True)[:3]
          for row in rows:
              print("https://oxygen11.com/articles/" + row["slug"] + "/")
          PY
          while IFS= read -r url; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || [[ "$bytes" -lt 1500 ]] || ! grep -qi '<title>' "$body"; then
              echo "::error::Article page not publicly served: $url (HTTP $status, $bytes bytes)"
              head -c 180 "$body" || true
              rm -f "$body"
              exit 1
            fi
            echo "Article page OK: $url ($bytes bytes)."
            rm -f "$body"
          done < /tmp/oxygen-article-urls.txt

          sitemap="$(mktemp)"
          status="$(curl -sS -L --max-time 30 -o "$sitemap" -w '%{http_code}' 'https://oxygen11.com/sitemap.xml?deployment_check=1' || true)"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || ! grep -q '<urlset' "$sitemap"; then
            echo "::error::Sitemap is not publicly served (HTTP $status)."
            rm -f "$sitemap"
            exit 1
          fi
          echo "Sitemap is publicly served."
          rm -f "$sitemap"

      - name: Discover and trigger the WordPress cron endpoint
        if: ${{ vars.OXYGEN_WP_CRON_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            'https://oxygen11.com/wp-cron.php?doing_wp_cron=1'
            'https://googl.oxygen11.com/wp-cron.php?doing_wp_cron=1'
          )
          found=0
          for url in "${targets[@]}"; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && [[ "$bytes" -le 8192 ]] && ! grep -qiE '<!doctype html|<html([[:space:]>])' "$body"; then
              echo "WordPress cron endpoint responded on $url (HTTP $status, $bytes bytes)."
              found=1
              rm -f "$body"
              break
            fi
            echo "::warning::Cron endpoint did not validate: $url returned HTTP $status with $bytes bytes."
            head -c 160 "$body" || true
            echo
            rm -f "$body"
          done
          if [[ "$found" -ne 1 ]]; then
            echo "::error::Neither oxygen11.com nor googl.oxygen11.com exposes a valid wp-cron.php response. Confirm the WordPress installation root and Hostinger cron configuration before relying on daily publishing."
            exit 1
          fi
