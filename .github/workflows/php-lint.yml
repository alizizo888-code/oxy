name: PHP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find oxygen-ac-automation -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check homepage integration guardrails
        shell: bash
        run: |
          set -euo pipefail
          homepage="oxygen-ac-automation/assets/oxygen-maintenance-home.html"
          test -s "$homepage"
          grep -q '/oxygen-admin/' "$homepage"
          if grep -Eq 'const[[:space:]]+ADMIN_PASS[[:space:]]*=' "$homepage"; then
            echo "::error::A hard-coded admin password was found in the homepage HTML."
            exit 1
          fi
